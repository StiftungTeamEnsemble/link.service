services:
  server:
    image: kutt/kutt:v3.2.3
    volumes:
       - /DATA/link/database/:/var/lib/kutt
       - /DATA/link/custom/:/kutt/custom
    environment:
      DB_FILENAME: "/var/lib/kutt/data.sqlite"
      JWT_SECRET: "${JWT_SECRET}"
      DEFAULT_DOMAIN: link.team-ensemble.ch
      PORT: 3500
    ports:
      - 3500:3500
